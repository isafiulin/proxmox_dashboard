services:
  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./deploy/.env
    environment:
      STORE_DRIVER: postgres
      BACKEND_VERSION: ${BACKEND_VERSION:-0.2.5}
      FRONTEND_VERSION: ${FRONTEND_VERSION:-1.1.6+8}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    depends_on:
      - postgres
    expose:
      - "8080"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neotelecom}
      POSTGRES_USER: ${POSTGRES_USER:-neotelecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
