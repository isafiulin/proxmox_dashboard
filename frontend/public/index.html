<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NeoTelecom Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7f9;
        color: #1f2933;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 40px 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.2;
      }

      p {
        max-width: 720px;
        color: #52616b;
        line-height: 1.6;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-top: 28px;
      }

      .card {
        min-height: 120px;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        background: #ffffff;
        padding: 18px;
      }

      .label {
        font-size: 13px;
        color: #627d98;
      }

      .value {
        margin-top: 16px;
        font-size: 28px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>NeoTelecom Infrastructure Dashboard</h1>
      <p>
        Временная стартовая страница. На этом месте будет Flutter Web интерфейс:
        источники Proxmox VE/PBS, VM/LXC, бэкапы, аудит и health-аналитика.
      </p>

      <section class="grid" aria-label="Dashboard summary">
        <article class="card">
          <div class="label">Источники</div>
          <div class="value">0</div>
        </article>
        <article class="card">
          <div class="label">Ноды</div>
          <div class="value">0</div>
        </article>
        <article class="card">
          <div class="label">VM/LXC</div>
          <div class="value">0</div>
        </article>
        <article class="card">
          <div class="label">Критичные события</div>
          <div class="value">0</div>
        </article>
      </section>
    </main>
  </body>
</html>
